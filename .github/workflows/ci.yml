name: ci

on:
  push:
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m unittest discover -s tests -t . -v

      - run: node --check frontend/app.js

  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: check
          POSTGRES_PASSWORD: check
          POSTGRES_DB: check
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U check"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://check:check@localhost/check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: python -m unittest tests.test_api -v

  container-smoke:
    runs-on: ubuntu-latest
    needs: [test-sqlite]

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t check .

      - run: |
          docker run -d --name c -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e JWT_SECRET=$(openssl rand -hex 32) \
            -e ADMIN_EMAIL=admin@example.com \
            -e ADMIN_PASSWORD=Admin-password-123 \
            check
          sleep 8
          python3 scripts/smoke_test.py http://127.0.0.1:8000
