services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: check, POSTGRES_PASSWORD: check, POSTGRES_DB: check}
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://check:check@db/check
    ports: ["8000:8000"]
    depends_on: [db]
    volumes: [plans:/app/data]
volumes: {pgdata: {}, plans: {}}
