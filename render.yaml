services:
  - type: web
    name: fundinglens-check
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - {key: ENVIRONMENT, value: production}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: PAYMENT_WEBHOOK_SECRET, generateValue: true}
      - {key: DATABASE_URL, sync: false}
      - {key: REQUIRE_INVITE, value: "true"}
